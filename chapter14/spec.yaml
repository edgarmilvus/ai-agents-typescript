book: "AI Agents in TypeScript"
chapter: 14
title: "What the Agent Keeps — Memory, Retrieval and the Cost of Remembering"

invariant: >
  Memory is a claim about the future: every fact kept costs context on every
  turn, every fact dropped costs a decision later, and a memory is only worth
  its budget if it changes what the agent does.

artifacts:
  - chapter14/memory.ts                    # records, the store, supersession, expiry
  - chapter14/retrieve.ts                  # lexical scoring, top-k, the recent baseline
  - chapter14/context.ts                   # the budget, three strategies, the assembler
  - chapter14/tasks.ts                     # twelve tasks and the facts they need
  - chapter14/runs/m1.json                 # live: the queries a model asks for
  - chapter14/files/00_record.ts           # records the live recall
  - chapter14/files/01_one_memory.ts       # one task, three strategies
  - chapter14/files/02_corpus.ts           # twelve tasks, three strategies
  - chapter14/files/03_retrieval.ts        # precision at k, with distractors
  - chapter14/files/04_drift.ts            # a summary of a summary
  - chapter14/files/05_budget.ts           # the cliff, as the budget shrinks
  - chapter14/files/06_poisoning.ts        # a memory written by a tool
  - chapter14/files/run_ex14.ts            # assertions
  - chapter14/files/exercises/*.ts         # five exercises + runner
  - chapter14/images/*.png                 # three kinds, retrieval, drift, budget

structure:
  - Theoretical Foundations
  - Basic Code Example
  - Common Pitfalls
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises
  - Solutions to the exercises
  - What this chapter established

multi_file_exercise:
  id: ex3
  title: "A retriever, a budget and a task"
  files: [ex3_index.ts, ex3_context.ts, ex3_run.ts]
  why: >
    ex3_index.ts is pure: documents and a query in, a ranked list out, with no
    store and no budget. ex3_context.ts owns the effect: it takes a ranked list
    and a token budget and returns what fits. ex3_run.ts is the wiring and the
    table. The ranking can be tested with four documents, which is the seam.

gates:
  harness: "node chapter14/files/run_ex14.ts"
  harness_expected: "52/52 checks passed"
  exercises: "node chapter14/files/exercises/run_exercises.ts"
  exercises_expected: "44/44 exercise checks passed"
  listings: "python3 tools/check_listings.py chapter14"
  words: "python3 tools/check_words.py chapter14"

words: { target: 17000, floor: 10900, actual: 19937 }
listing_count: 20
figure_count: 4

exercises:
  - id: ex1
    title: "A scorer you can argue with"
  - id: ex2
    title: "Facts that expire and facts that are replaced"
  - id: ex3
    title: "A retriever, a budget and a task"
  - id: ex4
    title: "A summary of a summary"
  - id: ex5
    title: "What remembering costs"
