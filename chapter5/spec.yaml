book: "AI Agents in TypeScript"
chapter: 5
title: "Grading — What \"Right\" Means When the Model Varies"

invariant: >
  An evaluation is a small, falsifiable claim: a case is a check on the world,
  the pass verdict comes from that check rather than from a score, the report
  prints its denominator, and a failure is triaged by the run rather than by
  the prose.

artifacts:
  - chapter5/grading.ts                 # Case, Check, Grader, Report, rubrics, triage
  - chapter5/files/01_first_eval.ts     # three cases over the refund desk
  - chapter5/files/02_rubric.ts         # partial credit without a pass
  - chapter5/files/03_triage.ts         # four failures, three kinds
  - chapter5/files/04_second_domain.ts  # the same suite over shipments
  - chapter5/files/run_ex5.ts           # 25 assertions
  - chapter5/files/exercises/*.ts       # five exercises + runner (28 assertions)
  - chapter5/images/*.png               # suite loop, triage taxonomy, file graph

structure:
  - Theoretical Foundations
  - Basic Code Example
  - Common Pitfalls
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises
  - Solutions to the exercises
  - What this chapter established

gates:
  harness: "node chapter5/files/run_ex5.ts"
  harness_expected: "25/25 checks passed"
  exercises: "node chapter5/files/exercises/run_exercises.ts"
  exercises_expected: "28/28 exercise checks passed"
  listings: "python3 tools/check_listings.py chapter5"
  words: "python3 tools/check_words.py chapter5"

words: { target: 17000, floor: 10900 }

exercises:
  - id: ex1
    title: "A grader that can fail"
  - id: ex2
    title: "Weights that add up"
  - id: ex3
    title: "The order of diagnosis"
  - id: ex4
    title: "A rate needs a denominator"
  - id: ex5
    title: "The same suite twice"
