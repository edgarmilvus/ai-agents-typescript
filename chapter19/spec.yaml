book: "AI Agents in TypeScript"
chapter: 19
title: "The Customer Who Hung Up — Streaming, Cancellation and the Cost of Silence"

invariant: >
  A cancellation is a property of the whole chain — listener, model stream, tool
  call, retry and ledger — not of the request that closed; if any link keeps
  working, the customer pays for a conversation nobody is having.

artifacts:
  - chapter19/stream.ts                    # the phases, the signal, the three modes
  - chapter19/probes.ts                    # eight places a disconnect leaks work
  - chapter19/files/01_one_hangup.ts       # one disconnect, two bills
  - chapter19/files/02_phases.ts           # where each mode stops
  - chapter19/files/03_matrix.ts           # the matrix
  - chapter19/files/04_partial.ts          # the answer that was cut in half
  - chapter19/files/05_tool.ts             # the refund that ran after the hang-up
  - chapter19/files/06_ledger.ts           # complete, cancelled and billed
  - chapter19/files/run_ex19.ts            # assertions
  - chapter19/files/exercises/*.ts         # five exercises + runner
  - chapter19/images/*.png                 # chain, matrix, billing, phases

structure:
  - Theoretical Foundations
  - Basic Code Example
  - Common Pitfalls
  - Advanced Application Implementation
  - How to run it
  - Reading a Transcript
  - Practical Exercises
  - Solutions to the exercises
  - What this chapter established

multi_file_exercise:
  id: ex3
  title: "A stream, a runner and a report"
  files: [ex3_stream.ts, ex3_runner.ts, ex3_run.ts]
  why: >
    ex3_stream.ts is pure: a script and a signal in, chunks out, with no ledger
    and no report. ex3_runner.ts owns the effect: it consumes the stream, runs
    the tool and writes the ledger. ex3_run.ts is the wiring and the table. The
    stream can be tested by aborting after two chunks, which is the seam.

gates:
  harness: "node chapter19/files/run_ex19.ts"
  harness_expected: "42/42 checks passed"
  exercises: "node chapter19/files/exercises/run_exercises.ts"
  exercises_expected: "35/35 exercise checks passed"
  listings: "python3 tools/check_listings.py chapter19"
  words: "python3 tools/check_words.py chapter19"

words: { target: 17000, floor: 10900, actual: 16978 }
listing_count: 16
figure_count: 4

exercises:
  - id: ex1
    title: "A stream that stops"
  - id: ex2
    title: "Billing the part that happened"
  - id: ex3
    title: "A stream, a runner and a report"
  - id: ex4
    title: "Two probes and both directions"
  - id: ex5
    title: "Three ledger states"
